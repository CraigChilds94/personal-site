<section class="text-gray-600 body-font">
  <div class="section">
    <h1 class="section-heading">I write stuff sometimes</h1>
    <div class="grid lg:grid-cols-3 gap-6">
      {{ range hugo.Data.articles.list }}
        <a href="{{ .url }}"
           rel="noopener noreferrer"
           target="_blank"
           class="card border-transparent hover:border-gray-300 transition-colors">
          <div class="h-full flex items-start">
            <div class="w-12 flex-shrink-0 flex flex-col text-center leading-none">
              <span class="text-sm text-gray-500 pb-2 mb-2 border-b-2 border-gray-200 text-center">
                {{ .publishedDate | dateFormat "Jan" }}  {{ .publishedDate | dateFormat "2006" }}
              </span>
              <span class="text-lg font-semibold text-gray-800 leading-none">
                {{ .publishedDate | dateFormat "2" }}
              </span>
            </div>
            <div class="flex-grow pl-6">
              <h2 class="eyebrow text-green-500 mb-1">
                {{ .category }}
              </h2>
              <h1 class="card-title text-gray-900 mb-3">{{ .title }}</h1>
              <p class="leading-relaxed">{{ .excerpt }}</p>
            </div>
          </div>
        </a>
      {{ end }}
    </div>
  </div>
</section>
