<header class="text-gray-600 body-font">
    <div class="container mx-auto flex flex-wrap px-5 pt-10 flex-col md:flex-row items-center">
        <nav class="flex lg:w-2/5 flex-wrap items-center gap-x-6 text-base font-medium md:ml-auto">
            <a class="hover:text-gray-900 hover:underline" href="/">Home</a>
            <a class="hover:text-gray-900 hover:underline" href="/projects">Projects</a>
            <a class="hover:text-gray-900 hover:underline" href="{{ hugo.Data.socials.medium }}" rel="noopener noreferrer" target="_blank">Articles</a>
        </nav>
        <a
            href="/"
            class="flex order-first lg:order-none lg:w-1/5 items-center text-gray-900 lg:items-center lg:justify-center mb-4 md:mb-0">
            {{ partial "logo.html" . }}
        </a>
        <div class="lg:w-2/5 inline-flex lg:justify-end sm:ml-5 lg:ml-0">
            <a
                href="/coaching"
                class="btn btn-primary mt-4 md:mt-0">Want development coaching?
                <svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    class="w-4 h-4" viewBox="0 0 24 24">
                    <path d="M5 12h14M12 5l7 7-7 7"></path>
                </svg>
            </a>
        </div>
    </div>
</header>
