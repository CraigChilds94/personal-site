<section class="bg-gray-200 text-gray-600 body-font">
  <div class="section">
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-6 text-center">
      {{ range hugo.Data.stats }}
        <div>
          <h2 class="text-3xl sm:text-4xl font-semibold text-gray-900">{{ .title }}</h2>
          <p class="mt-1 text-sm">{{ .subtitle }}</p>
        </div>
      {{ end }}
    </div>
  </div>
</section>
