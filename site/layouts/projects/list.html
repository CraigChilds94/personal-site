{{ define "main" }}
  <article id="top" class="animate__animated animate__fadeIn">
    {{ partial "header.html" . }}

    <section class="section pt-24 md:pt-32">
      <p class="eyebrow">Side projects &amp; open source</p>
      <h1 class="section-heading mb-12">Things I've <span class="text-accent">made</span></h1>
      <div class="grid gap-6 md:grid-cols-2">
        {{ range .Pages }}
          <div class="card flex flex-col">
            <h2 class="card-title">{{ .Title }}</h2>
            <p class="mt-3 flex-grow leading-relaxed text-fg-muted">{{ .Params.description }}</p>
            <a href="{{ .Params.link }}" class="link-arrow mt-6" rel="noopener noreferrer" target="_blank">Learn more
              <svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" class="w-4 h-4" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"></path></svg>
            </a>
          </div>
        {{ end }}
      </div>
    </section>

    {{ partial "footer.html" . }}
  </article>
{{ end }}
