{{ define "main" }}
  <article class="m-6 lg:m-0 animate__animated animate__fadeIn">
    {{ partial "header.html" . }}

    <section class="text-gray-600 body-font overflow-hidden">
      <div class="section">
        <h1 class="section-heading">Projects</h1>
        <div class="divide-y-2 divide-gray-100">
          {{ range .Pages }}
            <div class="py-8 flex flex-wrap md:flex-nowrap">
              <div class="md:w-64 md:mb-0 mb-6 flex-shrink-0 flex flex-col">
                <h2 class="card-title text-gray-900">{{ .Title }}</h2>
              </div>
              <div class="md:flex-grow">
                <p class="leading-relaxed">{{ .Params.description }}</p>
                <a href="{{ .Params.link }}" class="link-arrow text-green-500">Learn More
                  <svg class="w-4 h-4" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none"
                      stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12h14"></path>
                    <path d="M12 5l7 7-7 7"></path>
                  </svg>
                </a>
              </div>
            </div>
          {{ end }}
        </div>
      </div>
    </section>

    {{ partial "footer.html" . }}
  </article>
{{ end }}
