<section class="section pt-24 md:pt-32">
  <div class="flex items-center gap-4">
    <img alt="Photo of {{ .Params.sidebar.name }}" class="h-12 w-12 rounded-full border border-line object-cover" src="{{ .Params.avatar | relURL }}">
    <p class="eyebrow">{{ .Params.eyebrow }}</p>
  </div>

  <h1 class="mt-8 max-w-4xl text-4xl font-bold leading-[1.1] tracking-tight text-fg sm:text-6xl sm:leading-none md:text-7xl">
    {{ .Params.headline | safeHTML }}
  </h1>

  <div class="content lede mt-8 sm:text-lg">{{ .Content }}</div>

  <div class="mt-10 flex flex-wrap gap-3">
    <a class="btn btn-primary" href="/projects/">See my projects
      <svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" class="w-4 h-4" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"></path></svg>
    </a>
    <a class="btn btn-secondary" href="/coaching/">Development coaching</a>
  </div>
</section>
