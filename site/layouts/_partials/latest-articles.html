<section class="section" data-reveal>
  <div class="mb-12 flex flex-wrap items-end justify-between gap-4">
    <div>
      <p class="eyebrow">Writing</p>
      <h2 class="section-heading">I write stuff <span class="text-accent">sometimes</span></h2>
    </div>
    <a class="link-arrow" href="{{ hugo.Data.socials.medium }}" rel="noopener noreferrer" target="_blank">All articles
      <svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" class="w-4 h-4" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"></path></svg>
    </a>
  </div>
  <ul class="grid gap-6 lg:grid-cols-3">
    {{ range hugo.Data.articles.list }}
      <li><a href="{{ .url }}" rel="noopener noreferrer" target="_blank" class="card card-glow flex flex-col">
        <div class="flex flex-wrap gap-2">
          {{ range split .category ", " }}<span class="chip">{{ . }}</span>{{ end }}
        </div>
        <h3 class="card-title mt-6">{{ .title }}</h3>
        <p class="mt-3 grow leading-relaxed text-fg-muted">{{ .excerpt }}</p>
        <p class="mt-6 text-sm text-fg-subtle"><time datetime="{{ .publishedDate | dateFormat "2006-01-02" }}">{{ .publishedDate | dateFormat "2 January 2006" }}</time></p>
      </a></li>
    {{ end }}
  </ul>
</section>
