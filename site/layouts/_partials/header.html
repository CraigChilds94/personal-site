<header class="sticky top-0 z-50 border-b border-line bg-ink/80 backdrop-blur-sm">
  <div class="container mx-auto flex max-w-6xl items-center justify-between gap-4 px-5 py-3">
    <a href="/" class="flex items-center gap-3 text-sm font-semibold text-fg">
      <span class="block w-9 [&>svg]:h-auto [&>svg]:w-full">{{ partial "logo.html" . }}</span>
      <span class="hidden sm:inline">Craig Childs</span>
    </a>
    <nav class="flex items-center gap-1">
      <a class="nav-link {{ if eq .RelPermalink "/" }}is-active{{ end }}" href="/">Home</a>
      <a class="nav-link {{ if eq .Section "projects" }}is-active{{ end }}" href="/projects/">Projects</a>
      <a class="nav-link" href="{{ hugo.Data.socials.medium }}" rel="noopener noreferrer" target="_blank">Articles</a>
      <a class="btn btn-secondary ml-2 hidden md:inline-flex {{ if eq .Section "coaching" }}border-white/25{{ end }}" href="/coaching/">
        Coaching
        <svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" class="w-4 h-4" viewBox="0 0 24 24">
          <path d="M5 12h14M12 5l7 7-7 7"></path>
        </svg>
      </a>
    </nav>
  </div>
</header>
