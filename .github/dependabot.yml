version: 2
updates:
  - package-ecosystem: npm # also covers pnpm-lock.yaml
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    versioning-strategy: increase
    groups:
      # One PR a week for routine bumps; majors still get their own PR
      minor-and-patch:
        update-types: [minor, patch]
